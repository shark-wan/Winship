[package]
name = "winship"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Debian desktop manager for a Windows libvirt VM with PCI passthrough"
license = "GPL-3.0-or-later"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
qt-build-utils = "0.10"

[dev-dependencies]
roxmltree = "0.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
