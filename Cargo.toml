[package]
name = "winship"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local web manager for one Windows libvirt VM with PCI passthrough"
license = "GPL-3.0-or-later"

[dependencies]
askama = "=0.14.0"
axum = { version = "=0.8.9", features = ["form"] }
rand = "=0.9.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "=0.6.6", features = ["compression-gzip"] }

[dev-dependencies]
roxmltree = "0.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
