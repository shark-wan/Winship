[package]
name = "winship"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Debian desktop manager for a Windows libvirt VM with PCI passthrough"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.32.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15.3", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
roxmltree = "0.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

